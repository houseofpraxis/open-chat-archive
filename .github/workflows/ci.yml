name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: false
      - run: python3 -m pip install -e .
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=src python3 scripts/validate_repository.py
      - name: vault
        working-directory: toolkit-go
        env:
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""
          GOPRIVATE: ""
        run: |
          go test -race ./...
          go vet ./...
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: false
      - name: native vault
        working-directory: toolkit-go
        env:
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""
          GOPRIVATE: ""
        run: |
          go test -race -count=1 ./...
          go vet ./...
          go build -o oca-vault ./cmd/oca-vault
          ./oca-vault --version
